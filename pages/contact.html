        <section>
            <div class="max-w-page mx-auto px-6 sm:px-10 py-16 md:py-24 lg:py-28">
                <h1 class="section-title" data-animate>Let&rsquo;s talk</h1>
                <div class="mt-6 h-px bg-line rule-draw" data-animate style="--delay:120ms"></div>

                <div class="mt-8 md:mt-12 grid lg:grid-cols-12 gap-x-12 gap-y-12">
                    <div class="lg:col-span-5" data-animate>
                        <p class="text-body leading-relaxed text-[1.0625rem] max-w-[26rem]">
                            Send a note below, or reach me directly. I typically respond within a couple of business days.
                        </p>
                        <div class="mt-8 flex flex-wrap gap-3" data-stagger>
                            <a href="mailto:arly@trenck.net" class="btn w-full sm:w-auto px-5 py-3.5" data-animate>
                                <i class="fa-solid fa-envelope" aria-hidden="true"></i><span>Email</span>
                            </a>
                            <a href="https://www.linkedin.com/in/arlytrenck" target="_blank" rel="me noopener noreferrer" class="btn w-full sm:w-auto px-5 py-3.5" data-animate>
                                <i class="fa-brands fa-linkedin" aria-hidden="true"></i><span>LinkedIn</span>
                            </a>
                            <a href="https://www.credly.com/users/arlington-trenck" target="_blank" rel="me noopener noreferrer" class="btn w-full sm:w-auto px-5 py-3.5" data-animate>
                                <i class="fa-solid fa-award" aria-hidden="true"></i><span>Credly</span>
                            </a>
                        </div>
                    </div>

                    <form id="contact-form" class="lg:col-span-7" action="mailto:arly@trenck.net" method="post" enctype="text/plain" data-animate style="--delay:120ms">
                        <div class="grid sm:grid-cols-2 gap-x-6 gap-y-6">
                            <div class="flex flex-col">
                                <label for="cf-name" class="kicker kicker-muted mb-2.5">Name</label>
                                <input id="cf-name" name="name" type="text" autocomplete="name" required class="bg-surface border border-line focus:border-navy focus:ring-2 focus:ring-navy/15 outline-none px-3.5 py-2.5 text-ink transition-colors">
                            </div>
                            <div class="flex flex-col">
                                <label for="cf-email" class="kicker kicker-muted mb-2.5">Email</label>
                                <input id="cf-email" name="email" type="email" autocomplete="email" required class="bg-surface border border-line focus:border-navy focus:ring-2 focus:ring-navy/15 outline-none px-3.5 py-2.5 text-ink transition-colors">
                            </div>
                            <div class="flex flex-col sm:col-span-2">
                                <label for="cf-message" class="kicker kicker-muted mb-2.5">Message</label>
                                <textarea id="cf-message" name="message" rows="5" required class="bg-surface border border-line focus:border-navy focus:ring-2 focus:ring-navy/15 outline-none px-3.5 py-2.5 text-ink transition-colors resize-y"></textarea>
                            </div>
                        </div>
                        <div class="mt-7 flex flex-col sm:flex-row sm:items-center gap-4">
                            <button type="submit" class="btn btn-solid w-full sm:w-auto"><span>Send message</span></button>
                            <p id="cf-note" class="text-sm text-muted" role="status" aria-live="polite"></p>
                        </div>
                    </form>
                </div>
            </div>
        </section>
